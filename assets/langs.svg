      <circle cx="27" cy="92" r="5" fill="#3178C6"/>
      <text x="40" y="96" fill="#e6e8f0" font-size="13">TypeScript</text>
      <text x="202" y="96" fill="#8b93b0" font-size="12" text-anchor="end">42.3%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.60s" fill="freeze"/>
      <circle cx="232" cy="92" r="5" fill="#3572A5"/>
      <text x="245" y="96" fill="#e6e8f0" font-size="13">Python</text>
      <text x="407" y="96" fill="#8b93b0" font-size="12" text-anchor="end">34.6%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.70s" fill="freeze"/>
      <circle cx="27" cy="122" r="5" fill="#4F5D95"/>
      <text x="40" y="126" fill="#e6e8f0" font-size="13">PHP</text>
      <text x="202" y="126" fill="#8b93b0" font-size="12" text-anchor="end">9.6%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.80s" fill="freeze"/>
      <circle cx="232" cy="122" r="5" fill="#663399"/>
      <text x="245" y="126" fill="#e6e8f0" font-size="13">CSS</text>
      <text x="407" y="126" fill="#8b93b0" font-size="12" text-anchor="end">5.8%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.90s" fill="freeze"/>
      <circle cx="27" cy="152" r="5" fill="#E34C26"/>
      <text x="40" y="156" fill="#e6e8f0" font-size="13">HTML</text>
      <text x="202" y="156" fill="#8b93b0" font-size="12" text-anchor="end">4.2%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.00s" fill="freeze"/>
      <circle cx="232" cy="152" r="5" fill="#F1E05A"/>
      <text x="245" y="156" fill="#e6e8f0" font-size="13">JavaScript</text>
      <text x="407" y="156" fill="#8b93b0" font-size="12" text-anchor="end">2.4%</text>
