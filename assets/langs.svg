<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 226" width="440" height="226" role="img" aria-label="LINGUAGENS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050713"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="440" height="226" rx="14" fill="url(#bg)"/>
  <ellipse cx="400" cy="24" rx="150" ry="90" fill="url(#haze)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#ffffff">
    <circle cx="26" cy="204" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="192" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="366" cy="18" r="1"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="12" r="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0.75" y="0.75" width="438.5" height="224.5" rx="13.5"
        fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
